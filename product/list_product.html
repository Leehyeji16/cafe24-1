<li class="prdList__item" id="anchorBoxId_{$product_no}">
    <div class="thumbnail">
        <a href="/product/detail.html{$param}" name="anchorBoxName_{$product_no}">
            <img src="{$image_medium}" alt="{$seo_alt_tag}" />
        </a>
    </div>
    <div class="description">
        <p class="name">
            <a href="/product/detail.html{$param}">
                {$product_name}
            </a>
        </p>
        <p class="price">
            <span class="{$product_price_strike}" style="display:none;">{$product_price}</span>
            <strong class="sale">{$disp_product_price}</strong>
        </p>
    </div>
</li>
